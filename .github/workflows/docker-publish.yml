# .github/workflows/docker-publish.yml
name: CI/CD to Docker Hub

# Триггеры: когда пуш в main или создаю Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    # Задача выполняется на стандартной Ubuntu-машине от GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Логинимся в Docker Hub используя сохраненные секреты
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Собираем образ и отправляем его в Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                     # Где лежит Dockerfile (в корне)
          push: true                      # Отправлять ли образ в реестр
          # Теги для образа: latest и уникальный по ID коммита
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/insurance_api:latest
            ${{ secrets.DOCKER_USERNAME }}/insurance_api:${{ github.sha }}